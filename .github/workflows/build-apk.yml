- name: Verify APK
        run: |
          APK_PATH="${PROJECT_DIR}/android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "APK was not generated."
            find "${PROJECT_DIR}/android/app/build/outputs" -type f 2>/dev/null || true
            exit 1
          fi

          ls -lh "$APK_PATH"
          echo "APK successfully generated!"

      - name: Prepare APK
        run: |
          mkdir -p apk
          cp "${PROJECT_DIR}/android/app/build/outputs/apk/debug/app-debug.apk" \
             apk/Upian-Pro.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Upian-Pro-APK
          path: apk/Upian-Pro.apk
