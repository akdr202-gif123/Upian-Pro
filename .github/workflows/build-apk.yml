name: Build Upian Pro APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -q "upian-pro (2).zip" -d extracted
          echo "ZIP extracted"
          find extracted -name package.json

      - name: Find project folder
        run: |
          PROJECT_DIR=$(dirname "$(find extracted -name package.json | head -1)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Project folder: $PROJECT_DIR"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Build web app
        run: npm run build
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Sync Capacitor Android
        run: npx cap sync android
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: gradle assembleDebug --no-daemon
        working-directory: ${{ env.PROJECT_DIR }}/android

      - name: Copy APK
        run: |
          mkdir -p apk
          cp "${PROJECT_DIR}/android/app/build/outputs/apk/debug/app-debug.apk" apk/Upian-Pro.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Upian-Pro-APK
          path: apk/Upian-Pro.apk
