name: Build Upian Pro APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -q "upian-pro (2).zip" -d extracted
          echo "ZIP extracted"
          find extracted -name package.json

      - name: Find project folder
        run: |
          PROJECT_DIR=$(dirname "$(find extracted -name package.json | head -1)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project folder: $PROJECT_DIR"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Check Java
        run: |
          java -version
          javac -version

      - name: Install dependencies
        run: npm install
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Build web app
        run: npm run build
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Sync Capacitor
        run: npx cap sync android
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Remove invalid Gradle Wrapper JAR
        run: |
          rm -f gradle/wrapper/gradle-wrapper.jar
          echo "Invalid Gradle Wrapper JAR removed."
        working-directory: ${{ env.PROJECT_DIR }}/android

      - name: Install Gradle 9.5.0
        run: |
          curl -fL --retry 3 \
            -o gradle.zip \
            https://services.gradle.org/distributions/gradle-9.5.0-bin.zip

          unzip -q gradle.zip -d "$HOME"

          echo "$HOME/gradle-9.5.0/bin" >> "$GITHUB_PATH"

          "$HOME/gradle-9.5.0/bin/gradle" --version

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Find Generated APK
        run: |
          echo "Searching for APK files..."

          find "${PROJECT_DIR}/android" -type f -name "*.apk" -print

          APK=$(find "${PROJECT_DIR}/android" \
            -type f \
            -name "*.apk" \
            | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: No APK was generated."
            echo "Checking Android build outputs..."
            find "${PROJECT_DIR}/android/app/build" -maxdepth 5 -type f 2>/dev/null || true
            exit 1
          fi

          echo "APK found at:"
          echo "$APK"

          mkdir -p apk
          cp "$APK" apk/Upian-Pro.apk

          ls -lh apk/Upian-Pro.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Upian-Pro-APK
          path: apk/Upian-Pro.apk
