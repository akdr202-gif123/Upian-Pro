name: Build Upian Pro APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -q "upian-pro (2).zip" -d extracted
          echo "ZIP extracted"
          find extracted -name package.json

      - name: Find project folder
        run: |
          PROJECT_DIR=$(dirname "$(find extracted -name package.json | head -1)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project folder: $PROJECT_DIR"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Check Java
        run: |
          java -version
          javac -version

      - name: Install dependencies
        run: npm install
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Build web app
        run: npm run build
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Sync Capacitor
        run: npx cap sync android
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Remove invalid Gradle Wrapper JAR
        run: |
          if [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            rm -f gradle/wrapper/gradle-wrapper.jar
            echo "Invalid Gradle Wrapper JAR removed."
          else
            echo "No Gradle Wrapper JAR found."
          fi
        working-directory: ${{ env.PROJECT_DIR }}/android

      - name: Install Gradle 9.5.0
        run: |
          curl -fL --retry 3 \
            -o gradle.zip \
            https://services.gradle.org/distributions/gradle-9.5.0-bin.zip

          unzip -q gradle.zip -d "$HOME"

          echo "$HOME/gradle-9.5.0/bin" >> "$GITHUB_PATH"

          "$HOME/gradle-9.5.0/bin/gradle" --version

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace
        working-directory: ${{ env.PROJECT_DIR }}/android

      - name: Verify APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "APK was not generated."
            exit 1
          fi

          ls -lh "$APK_PATH"
          echo "APK successfully generated."

      - name: Prepare APK
        run: |
          mkdir -p apk
          cp "${PROJECT_DIR}/android/app/build/outputs/apk/debug/app-debug.apk" \
             apk/Upian-Pro.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Upian-Pro-APK
          path: apk/Upian-Pro.apk
